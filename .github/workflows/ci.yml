# ci.yml: the same gate scripts/release.sh runs locally before it will cut a
# tag (go build / vet / test), run on every push and PR so the gate is never
# the first place a break is discovered.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        # CGO off everywhere, so CI cannot pass on a binary the release path
        # would never produce (agents.md invariant #11).
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: boundary
        # The import-boundary ratchet (duck/2026-10-12 §1): a new forbidden
        # edge fails; an allowed edge that stopped occurring fails as stale.
        run: sh scripts/check-boundary.sh

  # The hermetic T0 gate: the same checks as above plus the boundary, under
  # the flake's toolchain and vendor hash, so CI and every worktree agree.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      - name: flake check
        run: nix flake check -L
