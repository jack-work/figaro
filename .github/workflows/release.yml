name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # goreleaser derives the version from the tag and the changelog from
          # history. A shallow clone with no tags makes it guess, and it guesses
          # wrong (0.0.1-next).
          fetch-depth: 0
          fetch-tags: true

      - name: release notes from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git cat-file -t "refs/tags/$TAG")" = tag ] || {
            echo "::error::$TAG is not an annotated tag; scripts/release.sh writes the notes into one"
            exit 1
          }
          git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/tag-message"
          subject=$(head -n 1 "$RUNNER_TEMP/tag-message")
          tail -n +2 "$RUNNER_TEMP/tag-message" | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
            git log --no-merges --format='- %s' ${prev:+"$prev.."}"$TAG" > "$RUNNER_TEMP/notes.md"
          fi
          printf 'FIGARO_RELEASE_TITLE=%s\n' "$subject" >> "$GITHUB_ENV"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # go.mod is the single declaration of the toolchain. Naming a version
          # here would be a second one, free to drift.
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.20.1
          # THE CASK IS SKIPPED WHEN ITS TOKEN IS NOT THERE. Pushing to
          # jack-work/homebrew-tap needs a PAT the automatic GITHUB_TOKEN
          # cannot stand in for, and without it goreleaser fails the whole
          # run AFTER uploading the archives -- so every release since the
          # tap was added has been red while its assets were, in fact, fine.
          # A missing optional publisher is a warning, not a failure.
          args: >-
            release --clean
            --release-notes ${{ runner.temp }}/notes.md
            ${{ secrets.HOMEBREW_TAP_TOKEN == '' && '--skip=homebrew' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the cask to jack-work/homebrew-tap, a DIFFERENT repo, which
          # the automatic GITHUB_TOKEN cannot write to. This secret must be
          # created by hand: a fine-grained PAT (or classic PAT with `repo`)
          # scoped to jack-work/homebrew-tap with contents:write, stored as
          # the HOMEBREW_TAP_TOKEN repository secret. Until it exists the cask
          # is skipped (see args above) and the release is green without it.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
