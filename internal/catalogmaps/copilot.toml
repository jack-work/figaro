[catalog]
list       = "data"
id         = ["id"]
name       = ["name"]
context    = ["billing.token_prices.default.max_prompt_tokens", "capabilities.limits.max_context_window_tokens"]
long       = ["billing.token_prices.long_context.max_prompt_tokens", "capabilities.limits.max_context_window_tokens"]
max_output = ["capabilities.limits.max_output_tokens"]
images     = ["capabilities.supports.vision"]
tools      = ["capabilities.supports.tool_calls"]
reasoning  = ["capabilities.supports.reasoning_effort nonempty"]
visible    = ["model_picker_enabled"]
endpoints  = ["supported_endpoints"]
max_prompt_image_size = ["capabilities.limits.vision.max_prompt_image_size"]
max_prompt_images     = ["capabilities.limits.vision.max_prompt_images"]
