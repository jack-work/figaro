[[bind]]
principals = ["user:2001", "user:admin@auth.kelliher.info"]
role = "owner"

[[bind]]
principals = ["sandbox:box0@local:box", "sandbox:chat@local:box", "sandbox:receipt@local:box"]
role = "box"

[[bind]]
principals = ["troupe:kelliher"]
role = "lent-to-troupe"

[roles.box]
grants = ["create:*", "use:sandbox:self", "read:sandboxed:self", "listen:sandboxed:self", "send:sandboxed:self", "fork:sandboxed:self", "set:sandboxed:self", "kill:sandboxed:self"]

[roles.lent-to-troupe]
grants = ["read:unboxed", "listen:unboxed", "send:unboxed", "fork:unboxed", "set:unboxed", "kill:unboxed", "create:*"]

[roles.owner]
grants = ["*:*"]
