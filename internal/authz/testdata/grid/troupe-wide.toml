[roles.ops]
permissions = [
  "read:unboxed", "read:role:@4e0a1d5c8b7f2e3a9c6d0b1f2a3e4d5c", "read:owner:self", "listen:unboxed", "listen:role:@4e0a1d5c8b7f2e3a9c6d0b1f2a3e4d5c", "listen:owner:self", "send:unboxed", "send:role:@4e0a1d5c8b7f2e3a9c6d0b1f2a3e4d5c", "send:owner:self",
  "create:*", "join:*",
  "admin:*",
  "use:sandbox:box0", "use:sandbox:self",
  "kill:lineage:a-box0", "kill:sandboxed:self", "set:lineage:a-box0", "set:sandboxed:self",
]
[roles.guest]
permissions = ["read:aria:a-guest", "read:troupe:kelliher"]
[[bind]]
role = "ops"
principals = ["user:bob@auth.kelliher.info", "peer1/user:2001"]
groups = ["ops@auth.kelliher.info"]
[[bind]]
role = "guest"
principals = ["user:guest@auth.kelliher.info", "sandbox:box0@local:box"]
