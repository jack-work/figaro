[roles.owner]
permissions = ["*:*"]
[roles.covered]
permissions = [
  "admin:*", "admin:troupe:kelliher",
  "*:aria:a-guest",
  "read:aria:a-guest", "read:lineage:a-box0", "kill:aria:a-guest", "kill:lineage:a-box0",
]
[roles.mixed]
permissions = [
  "read:owner:self", "read:role:@4e0a1d5c8b7f2e3a9c6d0b1f2a3e4d5c", "read:lineage:a-box0", "read:unboxed", "listen:owner:self", "listen:role:@4e0a1d5c8b7f2e3a9c6d0b1f2a3e4d5c", "listen:lineage:a-box0", "listen:unboxed", "send:owner:self", "send:role:@4e0a1d5c8b7f2e3a9c6d0b1f2a3e4d5c", "send:lineage:a-box0", "send:unboxed", "fork:owner:self", "fork:role:@4e0a1d5c8b7f2e3a9c6d0b1f2a3e4d5c", "fork:lineage:a-box0", "fork:unboxed",
  "set:sandboxed:self", "set:aria:a-admin", "kill:sandboxed:self", "kill:aria:a-admin",
  "use:sandbox:self", "use:sandbox:bwrap", "use:sandbox:local",
  "join:troupe:kelliher", "join:troupe:other", "admin:troupe:kelliher", "admin:troupe:other",
  "read:unboxed", "read:unboxed", "read:unboxed", "read:unboxed",
]
[roles.boxed]
permissions = ["create:sandbox:self", "create:sandboxed:self", "use:sandbox:self", "use:sandboxed:self", "read:sandbox:self", "read:sandboxed:self"]
[[bind]]
role = "owner"
principals = ["user:1000"]
[[bind]]
role = "covered"
principals = ["user:bob@auth.kelliher.info"]
[[bind]]
role = "mixed"
principals = ["user:guest@auth.kelliher.info", "peer1/user:2001"]
groups = ["ops@auth.kelliher.info"]
[[bind]]
role = "boxed"
principals = ["sandbox:box0@local:box", "sandbox:*"]
[[bind]]
role = "covered"
principals = ["troupe:kelliher"]
