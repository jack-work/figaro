# .goreleaser.yaml: build the release artifacts and hang them off the GitHub
# release that scripts/release.sh already created.
#
# The division of labour matters. release.sh owns the version (flake.nix), the
# annotated tag, and the hand-written notes; it pushes the tag and creates the
# release. This file owns nothing but bytes: cross-compiled binaries, archives,
# checksums, and the Homebrew formula. Everything below is downstream of a tag
# that already exists.
#
#   goreleaser check                     # validate this file
#   goreleaser build --snapshot --clean  # local binaries, no tag needed
#   goreleaser release --clean           # what CI runs on a v* tag push
version: 2

project_name: figaro

before:
  hooks:
    - go mod download

builds:
  - id: figaro
    main: ./cmd/figaro
    binary: figaro
    env:
      # One static binary (agents.md invariant #11). CGO would drag in the
      # host libc and make the linux archives useless on musl systems.
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Reproducibility: without this the linker stamps the wall clock into
    # every binary, so two builds of the same tag hash differently and a
    # user cannot check our checksums against their own build.
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # The same three symbols flake.nix stamps, so a brew/curl figaro
      # reports exactly what a nix figaro reports. semver carries NO leading
      # v: goreleaser's .Version is already stripped, trimprefix is belt and
      # braces for the snapshot/nightly paths where it is not.
      - -X github.com/jack-work/figaro/internal/cli.semver={{ trimprefix .Version "v" }}
      - -X github.com/jack-work/figaro/internal/cli.commit={{ .FullCommit }}
      # Release builds run on a clean checkout, so the honest value is empty.
      # A dirty tree only ever happens under --snapshot, and saying so keeps
      # a locally-built snapshot from impersonating a release.
      - -X github.com/jack-work/figaro/internal/cli.commitDirty={{ if .IsGitDirty }}true{{ end }}

archives:
  - id: figaro
    ids: [figaro]
    # No share/figaro/skills tree: the first-party skills are embedded in the
    # binary, so an archive is one executable plus the paperwork. Single file
    # install is the whole point of this distribution path.
    name_template: figaro_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      # Windows has no tar in the shells people actually use to unpack this.
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  # Snapshot versions must not look like a real release when they land in
  # `figaro --version`. The -snapshot suffix is the tell.
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  # release.sh writes the notes by hand from the annotated tag message.
  # Nothing here should generate a competing changelog.
  disable: true

release:
  github:
    owner: jack-work
    name: figaro
  # THE IMPORTANT LINE. release.sh has already created the release with prose
  # notes taken from the tag. The default mode (replace) would overwrite that
  # body with goreleaser's own; `keep-existing` uploads the assets and leaves
  # the notes exactly as written. If the release does not exist yet (someone
  # pushed a tag without release.sh), goreleaser still creates it.
  mode: keep-existing

# A cask, not a formula. `brews:` is deprecated as of goreleaser 2.10 and
# `goreleaser check` now FAILS on it, so a formula is no longer a validated
# option here. The cost, stated plainly: casks are macOS-only, so Linux
# Homebrew users take install.sh or nix instead of `brew install`.
homebrew_casks:
  - name: figaro
    ids: [figaro]
    binaries: [figaro]
    repository:
      owner: jack-work
      name: homebrew-tap
      branch: main
      # A token with write access to the tap repo, created by hand and stored
      # as the HOMEBREW_TAP_TOKEN secret. The workflow's default GITHUB_TOKEN
      # is scoped to this repo and cannot push to jack-work/homebrew-tap.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://figar.org
    description: A coding agent with few opinions, firmly held.
    license: MIT
    commit_author:
      name: figaro-release
      email: releases@figar.org
    commit_msg_template: "figaro {{ .Version }}"
    # Completions are generated by running the binary we just staged, so they
    # can never drift from it. Same trick flake.nix pulls in postInstall.
    generate_completions_from_executable:
      executable: figaro
      args: [completion]
      shells: [bash, zsh, fish]
    hooks:
      post:
        # `fig` is a pure rename, not an argv rewrite: main.go reads
        # filepath.Base(os.Args[0]), so help and completions come out under
        # whichever name was typed. A cask has no bin.install_symlink, so the
        # alias is made by hand next to the binary brew just linked.
        install: |
          # The binary is not signed or notarized, and Homebrew quarantines
          # what it downloads. On Apple Silicon a quarantined unsigned binary
          # is killed on sight, so the xattr has to come off before the first
          # run rather than after the first confusing crash.
          system_command "/usr/bin/xattr",
                         args: ["-dr", "com.apple.quarantine", "#{staged_path}/figaro"],
                         must_succeed: false
          fig = "#{HOMEBREW_PREFIX}/bin/fig"
          File.delete(fig) if File.symlink?(fig) || File.exist?(fig)
          File.symlink("#{HOMEBREW_PREFIX}/bin/figaro", fig)
        uninstall: |
          fig = "#{HOMEBREW_PREFIX}/bin/fig"
          File.delete(fig) if File.symlink?(fig)
    caveats: |
      Also installed as `fig`. If a daemon from an older figaro is running,
      restart it:  figaro stop
